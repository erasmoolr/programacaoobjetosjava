name: Deploy Automático para Ubuntu Server

on:
  push:
    branches:
      - main  # Dispara a automação a cada push na branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do Repositório
        uses: actions/checkout@v5

      - name: Enviar os arquivos para o Ubuntu Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/html"